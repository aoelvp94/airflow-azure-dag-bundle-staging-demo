[project]
name = "wasb-archive-dag-bundle"
version = "0.1.0"
description = "Vendored WasbDagBundle and WasbArchiveDagBundle from apache/airflow#75657 tip c853ba97"
requires-python = ">=3.10"
# The provider is installed separately (see the Dockerfile). Declaring it
# here would pull the full Azure provider.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
